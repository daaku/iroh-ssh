[package]
name = "iroh-ssh"
description = "ssh without ip"
license = "MIT"
authors = ["Zacharias Boehler <rustonbsd@mailfence.com>"]
repository = "https://github.com/rustonbsd/iroh-ssh"
readme = "readme.md"
keywords = ["networking"]
categories = ["network-programming"]
version = "0.2.12"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
iroh = "1.3.0"
iroh-mdns-peer-lookup = "0.1.2"
iroh-mainline-address-lookup = "0.6.0"
tokio = { version = "1.53.2", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
clap = { version = "4.6.1", features = ["derive"] }
homedir = "0.3.6"
z32 = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
