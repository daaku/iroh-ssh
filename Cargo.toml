[package]
name = "iroh-ssh"
description = "ssh without ip"
license = "MIT"
authors = ["Zacharias Boehler <rustonbsd@mailfence.com>"]
repository = "https://github.com/rustonbsd/iroh-ssh"
readme = "readme.md"
keywords = ["networking"]
categories = ["network-programming"]
version = "0.2.12"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
iroh = "1.3.0"
iroh-mdns-peer-lookup = "0.1.2"
iroh-mainline-address-lookup = "0.6.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.3"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio = { version = "1.53.2", features = ["macros", "io-util", "sync", "rt-multi-thread", "signal"] }
clap = { version = "4.6.1", features = ["derive"] }
homedir = "0.3.6"
whoami = "2.1.3"
z32 = "1.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
