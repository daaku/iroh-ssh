[package]
name = "iroh-ssh"
version = "0.3.0"
categories = ["network-programming"]
edition = "2024"
keywords = ["networking"]
license = "MIT"
readme = "readme.md"
repository = "https://github.com/daaku/iroh-ssh"
description = "ssh over iroh"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.1", features = ["derive"] }
homedir = "0.3.6"
iroh = "1.3.0"
iroh-mainline-address-lookup = "0.6.0"
iroh-mdns-peer-lookup = "0.1.2"
tokio = {
  version = "1.53.2",
  features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "time",
  ],
}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
z32 = "1.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
